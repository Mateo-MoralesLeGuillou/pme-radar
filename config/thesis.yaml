# Thèse d'investissement par défaut : « Services B2B techniques récurrents en Île-de-France »
name: "Services B2B techniques récurrents en Île-de-France"

# Codes NAF rév. 2 (en vigueur jusqu'au 31/12/2026). tier = core (cœur de thèse) | adjacent.
# ✔ Les 13 codes ont été testés contre l'API réelle (dép. 92, 2026-11-04) : tous renvoient des
#   entreprises. Attention : la NAF 2025 s'applique au 01/01/2027 (voir ADR-002).
naf_codes:
  - { code: "33.12Z", label: "Réparation de machines et équipements mécaniques", tier: core }
  - { code: "33.14Z", label: "Réparation d'équipements électriques", tier: core }
  - { code: "33.20A", label: "Installation de structures métalliques, chaudronnées et de tuyauterie", tier: core }
  - { code: "33.20B", label: "Installation de machines et équipements mécaniques", tier: core }
  - { code: "33.20D", label: "Installation d'équipements électriques, électroniques et optiques", tier: core }
  - { code: "43.21A", label: "Travaux d'installation électrique dans tous locaux", tier: core }
  - { code: "43.22B", label: "Travaux d'installation d'équipements thermiques et de climatisation", tier: core }
  - { code: "80.20Z", label: "Activités liées aux systèmes de sécurité", tier: core }
  - { code: "81.10Z", label: "Activités combinées de soutien lié aux bâtiments", tier: core }
  - { code: "33.13Z", label: "Réparation d'équipements électroniques et optiques", tier: adjacent }
  - { code: "43.22A", label: "Travaux d'installation d'eau et de gaz en tous locaux", tier: adjacent }
  - { code: "43.29B", label: "Autres travaux d'installation n.c.a.", tier: adjacent }
  - { code: "71.20B", label: "Analyses, essais et inspections techniques", tier: adjacent }

# Tranches d'effectif salarié INSEE : 11=10-19, 12=20-49, 21=50-99, 22=100-199, 31=200-249
headcount_bands: ["11", "12", "21", "22", "31"]

# Île-de-France : Paris + petite et grande couronne
departments: ["75", "77", "78", "91", "92", "93", "94", "95"]

# Entreprises actives uniquement (A = active, C = cessée)
administrative_status: "A"
categories: ["PME"]

# Fourchette de valorisation indicative des fiches `pme-radar onepager` : VE = EBE × multiple.
# Ordres de grandeur usuels pour de petites PME de services (à ajuster à votre lecture du marché).
valuation:
  ebe_multiple_low: 4.0
  ebe_multiple_high: 6.0

# Montage LBO indicatif du rapport de deal flow (ordre de grandeur, à confronter aux banques).
financing:
  senior_debt_multiple: 2.5  # dette senior = 2,5 x EBE
  max_debt_share: 0.6        # plafonnée à 60 % du prix
  vendor_loan_share: 0.10    # crédit vendeur, en part du prix
  interest_rate: 0.055       # taux annuel de la dette senior
  amortization_years: 7      # durée d'amortissement
  cash_conversion: 0.6       # part de l'EBE disponible pour la dette (après IS, investissements, BFR)
  min_coverage: 1.3          # couverture du service de la dette jugée confortable
  max_equity_ticket: 6000000 # fonds propres au-delà desquels la levée du searcher devient difficile
