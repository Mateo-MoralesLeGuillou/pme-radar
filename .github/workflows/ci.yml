name: CI
on: [push, pull_request]

concurrency: # un nouveau push annule le run précédent de la même branche
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[all]"
      - name: Lint et formatage
        run: |
          ruff check .
          ruff format --check .
      - name: Typage
        run: mypy src
      - name: Configuration livrée valide
        run: pme-radar check-config
      - name: Tests
        run: pytest --cov=pme_radar --cov-report=term-missing
      - name: Run offline de bout en bout
        run: pme-radar run --offline
