[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pme-radar"
version = "0.1.0"
description = "Moteur d'origination search fund : PME françaises transmissibles à partir de l'open data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pandas>=2.1",
    "pyarrow>=15",
    "typer>=0.12",
    "pyyaml>=6",
    "tenacity>=8.2",
    "dnspython>=2.6",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.35", "plotly>=5.20"]
sheets = ["gspread>=6"]
llm = ["anthropic>=2.4"]  # paramètre `fallbacks` du repli serveur
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-PyYAML", "pandas-stubs"]
all = ["pme-radar[dashboard,sheets,llm,dev]"]

[project.scripts]
pme-radar = "pme_radar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
